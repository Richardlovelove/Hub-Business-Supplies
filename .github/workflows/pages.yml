name: Publicar cotizador

# Publica el cotizador en GitHub Pages. En Settings → Pages, «Source» debe
# estar en «GitHub Actions» para que este flujo tome el control.
on:
  push:
    branches:
      - main
      - claude/pdf-quote-generator-574284
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. Si llegan dos empujes seguidos, el segundo espera en
# lugar de pisar al primero a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Verificar y construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      # `npm run build` ya corre `tsc --noEmit` antes de empaquetar, así que un
      # error de tipos detiene el despliegue en vez de publicarse.
      - name: Construir
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
