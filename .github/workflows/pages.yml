name: Publicar hub

# Publica el hub en GitHub Pages. En Settings → Pages, «Source» debe estar en
# «GitHub Actions» para que este flujo tome el control.
#
# No hay construcción: el hub es un `index.html` suelto más la carpeta
# `assets/`, así que se sube la raíz del repo tal cual.
on:
  push:
    branches:
      - main
      - claude/empresa-tools-hub-k3mxx6
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. Si llegan dos empujes seguidos, el segundo espera en
# lugar de pisar al primero a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # `enablement: true` prende GitHub Pages en el repo si aún no lo está, en
      # lugar de fallar pidiendo que alguien entre a Settings → Pages a hacerlo
      # a mano. Es el paso que menos sentido tenía dejarle al usuario: es una
      # sola vez, siempre igual, y el flujo ya tiene el permiso `pages: write`
      # que hace falta.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: despliegue
        uses: actions/deploy-pages@v4
